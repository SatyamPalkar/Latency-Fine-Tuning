[project]
name = "llm-ttft-optimization-platform"
version = "0.1.0"
description = "A Dockerized FastAPI LLM inference service with streaming responses and TTFT benchmarking."
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "transformers==4.47.1",
  "torch==2.5.1",
  "accelerate==1.2.1",
  "pandas==2.2.3",
  "matplotlib==3.9.4",
  "seaborn==0.13.2",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  ".venv",
  "output",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
