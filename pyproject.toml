[project]
name = "llm-ttft-optimization-platform"
version = "0.2.0"
description = "A Dockerized FastAPI LLM inference service with streaming responses and TTFT benchmarking."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.1",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.3",
  "transformers==4.57.1",
  "torch==2.9.0",
  "plotly==5.24.1",
]

[project.optional-dependencies]
benchmark = ["pandas==2.2.3", "matplotlib==3.9.4", "seaborn==0.13.2", "requests==2.32.5"]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  ".venv",
  "output",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
